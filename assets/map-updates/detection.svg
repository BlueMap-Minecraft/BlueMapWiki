<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="379" rx="16" fill="#262626" stroke="#333333"/>

  <!-- column headings -->
  <text x="40" y="22" font-size="12" font-weight="700" fill="#999999" letter-spacing="0.5">HOW A CHANGE IS NOTICED</text>
  <text x="710" y="22" font-size="12" font-weight="700" fill="#999999" letter-spacing="0.5">RENDER QUEUE</text>

  <!-- sources that jump the line -->
  <g>
    <rect x="20" y="36" width="260" height="68" rx="12" fill="#2a2540" stroke="#9580f0" stroke-width="2"/>
    <text x="36" y="63" font-size="15" font-weight="700" fill="#e9e9e9">Full update</text>
    <text x="36" y="86" font-size="13" fill="#b4b4b4">Checks the whole map · every 24 h</text>
  </g>
  <g>
    <rect x="20" y="120" width="260" height="68" rx="12" fill="#2a2540" stroke="#9580f0" stroke-width="2"/>
    <text x="36" y="147" font-size="15" font-weight="700" fill="#e9e9e9">/bluemap update</text>
    <text x="36" y="170" font-size="13" fill="#b4b4b4">Started by an admin · any time</text>
  </g>

  <!-- sources that go through the waiting room -->
  <g>
    <rect x="20" y="204" width="260" height="68" rx="12" fill="#1b2a40" stroke="#2c84fa" stroke-width="2"/>
    <text x="36" y="231" font-size="15" font-weight="700" fill="#e9e9e9">File-system events</text>
    <text x="36" y="254" font-size="13" fill="#b4b4b4">The OS reports a changed file · any time</text>
  </g>
  <g>
    <rect x="20" y="288" width="260" height="68" rx="12" fill="#1b2a40" stroke="#2c84fa" stroke-width="2"/>
    <text x="36" y="315" font-size="15" font-weight="700" fill="#e9e9e9">Region-file check</text>
    <text x="36" y="338" font-size="13" fill="#b4b4b4">Peeks at all region files · every 5 min</text>
  </g>

  <!-- waiting room -->
  <text x="380" y="204" font-size="12" font-weight="700" fill="#999999" letter-spacing="0.5">WAIT &amp; BUNDLE</text>
  <g>
    <rect x="360" y="216" width="250" height="140" rx="12" fill="#36281a" stroke="#e0913a" stroke-width="2"/>
    <text x="376" y="244" font-size="15" font-weight="700" fill="#e9e9e9">Waiting room</text>
    <text x="376" y="268" font-size="13" fill="#b4b4b4">for each changed region file:</text>
    <text x="376" y="294" font-size="13" fill="#d0d0d0">• wait until the file has been</text>
    <text x="388" y="312" font-size="13" fill="#d0d0d0">quiet for 5 seconds</text>
    <text x="376" y="336" font-size="13" fill="#d0d0d0">• at most once per 60 s cooldown</text>
  </g>

  <!-- queue -->
  <g>
    <rect x="690" y="36" width="290" height="320" rx="12" fill="#1e1e1e" stroke="#4a4a4a" stroke-width="2"/>
    <rect x="706" y="54" width="258" height="38" rx="8" fill="#2c84fa"/>
    <text x="720" y="78" font-size="13" font-weight="700" fill="#ffffff">▶ update region r.0.0 (working)</text>
    <rect x="706" y="100" width="258" height="38" rx="8" fill="#2a2540" stroke="#9580f0" stroke-width="1.5"/>
    <text x="720" y="124" font-size="13" fill="#e9e9e9">update map "world"</text>
    <rect x="706" y="146" width="258" height="38" rx="8" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="720" y="170" font-size="13" fill="#e9e9e9">update region r.-1.2</text>
    <rect x="706" y="192" width="258" height="38" rx="8" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="720" y="216" font-size="13" fill="#e9e9e9">update region r.3.-2</text>
    <text x="835" y="252" text-anchor="middle" font-size="16" fill="#777777">⋮</text>
    <line x1="706" y1="280" x2="964" y2="280" stroke="#3d3d3d" stroke-width="1.5"/>
    <text x="835" y="306" text-anchor="middle" font-size="13" fill="#b4b4b4">Render threads work through</text>
    <text x="835" y="326" text-anchor="middle" font-size="13" fill="#b4b4b4">the list from top to bottom</text>
  </g>

  <!-- arrows -->
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <!-- full update / manual -> next in line -->
    <path d="M282,70 C520,70 600,116 703,116"/>
    <path d="M282,154 C520,154 600,124 703,124"/>
    <!-- sources -> waiting room -->
    <path d="M282,238 C320,238 320,262 357,262"/>
    <path d="M282,322 C320,322 320,302 357,302"/>
    <!-- waiting room -> end of queue -->
    <path d="M612,286 C660,286 660,211 703,211"/>
  </g>
  <text x="470" y="118" font-size="12" fill="#b3a4f5" text-anchor="middle">placed next in line</text>
  <text x="650" y="302" font-size="12" fill="#b4b4b4" text-anchor="middle">added at</text>
  <text x="650" y="317" font-size="12" fill="#b4b4b4" text-anchor="middle">the end</text>
</svg>
