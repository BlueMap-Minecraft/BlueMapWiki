<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0.5" y="0.5" width="999" height="309" rx="16" fill="#262626" stroke="#333333"/>

  <!-- row labels -->
  <text x="60" y="44" font-size="14" font-weight="700" fill="#e9e9e9">The server writes region file r.0.0</text>
  <text x="60" y="140" font-size="14" font-weight="700" fill="#e9e9e9">BlueMap updates that region</text>

  <!-- row lines -->
  <line x1="60" y1="80" x2="960" y2="80" stroke="#3d3d3d" stroke-width="2"/>
  <line x1="60" y1="175" x2="960" y2="175" stroke="#3d3d3d" stroke-width="2"/>

  <!-- cooldown band -->
  <rect x="140" y="155" width="600" height="40" rx="6" fill="#1b2a40"/>
  <text x="440" y="180" text-anchor="middle" font-size="13" fill="#b4c8e6">cooldown: this region is not updated again for 60 s</text>

  <!-- quiet period bracket -->
  <path d="M90,100 L90,106 L140,106 L140,100" fill="none" stroke="#e0913a" stroke-width="2"/>
  <text x="115" y="124" text-anchor="middle" font-size="12" fill="#f0b068">5 s quiet</text>

  <!-- change dots -->
  <g fill="#e0913a">
    <circle cx="60" cy="80" r="7"/>
    <circle cx="80" cy="80" r="7"/>
    <circle cx="90" cy="80" r="7"/>
    <circle cx="260" cy="80" r="7"/>
    <circle cx="460" cy="80" r="7"/>
  </g>

  <!-- later changes flow into the second update -->
  <g stroke="#e0913a" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <path d="M260,88 C260,120 700,110 735,165"/>
    <path d="M460,88 C460,115 710,112 737,165"/>
  </g>
  <text x="700" y="62" text-anchor="middle" font-size="12" fill="#f0b068">later changes are collected and handled together</text>

  <!-- update markers -->
  <g>
    <circle cx="140" cy="175" r="11" fill="#2c84fa"/>
    <path d="M134,175 L139,180 L147,170" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <circle cx="740" cy="175" r="11" fill="#2c84fa"/>
    <path d="M734,175 L739,180 L747,170" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- axis -->
  <line x1="60" y1="225" x2="960" y2="225" stroke="#777777" stroke-width="1.5"/>
  <g font-size="12" fill="#999999" text-anchor="middle">
    <line x1="60" y1="225" x2="60" y2="231" stroke="#777777"/><text x="60" y="246">0 s</text>
    <line x1="160" y1="225" x2="160" y2="231" stroke="#777777"/><text x="160" y="246">10 s</text>
    <line x1="260" y1="225" x2="260" y2="231" stroke="#777777"/><text x="260" y="246">20 s</text>
    <line x1="360" y1="225" x2="360" y2="231" stroke="#777777"/><text x="360" y="246">30 s</text>
    <line x1="460" y1="225" x2="460" y2="231" stroke="#777777"/><text x="460" y="246">40 s</text>
    <line x1="560" y1="225" x2="560" y2="231" stroke="#777777"/><text x="560" y="246">50 s</text>
    <line x1="660" y1="225" x2="660" y2="231" stroke="#777777"/><text x="660" y="246">60 s</text>
    <line x1="760" y1="225" x2="760" y2="231" stroke="#777777"/><text x="760" y="246">70 s</text>
    <line x1="860" y1="225" x2="860" y2="231" stroke="#777777"/><text x="860" y="246">80 s</text>
    <line x1="960" y1="225" x2="960" y2="231" stroke="#777777"/><text x="960" y="246">90 s</text>
  </g>

  <!-- legend -->
  <circle cx="68" cy="282" r="6" fill="#e0913a"/>
  <text x="82" y="287" font-size="13" fill="#d0d0d0">region file was written (changed)</text>
  <circle cx="340" cy="282" r="8" fill="#2c84fa"/>
  <text x="356" y="287" font-size="13" fill="#d0d0d0">region is sent to the render queue</text>
</svg>
